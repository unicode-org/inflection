# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
  # Keep it for manual runs.
  workflow_dispatch:
  # Run it on all branches but ignore some paths.
  pull_request:
    paths:
    - 'src/**'
    - 'resources/**'
    - 'tools/**'
    - 'test/**'
    - 'CMakeLists.txt'
    - 'icu_filters.json'
    - '.github/workflows/**'
    - '!tools/wikidata/**'
    - '!documents/**'
  # Run the build when we merge into main
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'resources/**'
      - 'tools/**'
      - 'test/**'
      - 'CMakeLists.txt'
      - 'icu_filters.json'
      - '.github/workflows/**'
      - '!tools/wikidata/**'
      - '!documents/**'
env:
  ICU_MAJOR: '79'
  ICU_MINOR: '1'

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Set up a matrix to run the following configurations:
      # 1. <Linux, Release, latest Clang compiler toolchain on the default runner image, default generator>
      #
      # To add more build types (Release, Debug, RelWithDebInfo, etc.) customize the build_type list.
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Release]
        c_compiler: [clang]
        # All [OS x compiler] items should be covered in include/exclude sections.
        include:
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++

          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++

    steps:
    - uses: actions/checkout@v4

    - name: Create Git LFS file list
      run: git lfs ls-files -l |cut -d' ' -f1 |sort >.git/lfs-hashes.txt

    - name: Restore Git LFS object cache
      # Cache the local LFS object store (all LFS-tracked paths in the repo), not just one
      # smudged output directory, so objects outside that directory still get checked out below.
      uses: actions/cache@v4
      id: lfscache
      with:
        path: .git/lfs
        key: ${{ runner.os }}-lfsdata-v1-${{ hashFiles('.git/lfs-hashes.txt') }}
        restore-keys: |
          ${{ runner.os }}-lfsdata-v1-
          ${{ runner.os }}-lfsdata

    - name: Fetch any needed Git LFS objects and prune extraneous ones
      run: git lfs fetch --prune

    - name: Check out Git LFS content
      # Always run, even on a cache hit, so every LFS-tracked file gets smudged from the
      # local object store. Skipping this on cache-hit previously left LFS files outside
      # the cached path (e.g. tokenizer/*/tokenizer.dictionary) as unresolved pointer text.
      run: git lfs checkout

    - name: Check LFS restore the files or not after checkout
      run: ls -l resources/org/unicode/inflection/dictionary/*

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "project-root-dir=${{ github.workspace }}" >> "$GITHUB_OUTPUT"
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
  
    - uses: actions/cache/restore@v4
      id: cache
      with:
        path: ~/icu
        key: ${{ runner.os }}-icu-filtered-${{ env.ICU_MAJOR }}-${{ env.ICU_MINOR }}-${{ hashFiles('icu_filters.json') }}

    - name: Install ICU with data filter (Ubuntu/macOS)
      run: |
        if [[ "${{ steps.cache.outputs.cache-hit }}" != "true" ]]; then
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            ICU_PLATFORM="MacOSX"
            NPROC=$(sysctl -n hw.ncpu)
          else
            ICU_PLATFORM="Linux"
            NPROC=$(nproc)
          fi
          pushd /tmp
          git clone --depth 1 --branch release-${ICU_MAJOR}.${ICU_MINOR} https://github.com/unicode-org/icu.git
          cd icu/icu4c/source
          ICU_DATA_FILTER_FILE="${GITHUB_WORKSPACE}/icu_filters.json" ./runConfigureICU "${ICU_PLATFORM}" --prefix="$HOME/icu/icu/usr/local" --enable-rpath --disable-samples --disable-tests --disable-extras --disable-icuio
          make -j"${NPROC}"
          make install
          popd
          rm -rf /tmp/icu
        fi
        echo "ICU_ROOT=$HOME/icu/icu/usr/local" >> $GITHUB_ENV

    - name: Save ICU cache
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/icu
        key: ${{ runner.os }}-icu-filtered-${{ env.ICU_MAJOR }}-${{ env.ICU_MINOR }}-${{ hashFiles('icu_filters.json') }}

    - name: Install lld (Ubuntu)
      # Linux Release builds link with -fuse-ld=lld to avoid gold-plugin LTO version mismatches.
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get update && sudo apt-get install -y lld

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ steps.strings.outputs.project-root-dir }}

    - name: Get number of CPU cores
      uses: SimenB/github-actions-cpu-cores@v2
      id: cpu-cores

    - name: Build
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} -j ${{ steps.cpu-cores.outputs.count }}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: cmake --build . -t check -j ${{ steps.cpu-cores.outputs.count }}
